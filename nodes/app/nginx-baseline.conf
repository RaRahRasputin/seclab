# app - nginx, BASELINE profile. Copied to /etc/nginx/nginx.conf
# The "before" application server: clear-text HTTP on port 8000, answers anyone.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    server_tokens on;

    log_format seclab '$remote_addr [$time_local] "$request" $status '
                      'client_cert=- cn="-" rt=$request_time';
    access_log /var/log/nginx/access.log seclab;

    server {
        listen 8000;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }
    }
}
