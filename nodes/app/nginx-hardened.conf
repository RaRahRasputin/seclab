# app - nginx, hardened profile. Copied to /etc/nginx/nginx.conf
# TLS front door of the application server. It demands a client certificate
# (mutual TLS) and only then relays the request to the Flask app on localhost.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    server_tokens off;

    log_format seclab '$remote_addr [$time_local] "$request" $status '
                      'client_cert=$ssl_client_verify cn="$ssl_client_s_dn" rt=$request_time';
    access_log /var/log/nginx/access.log seclab;

    server {
        listen 8443 ssl;
        server_name app.seclab.test;

        ssl_certificate     /etc/nginx/tls/app.crt;
        ssl_certificate_key /etc/nginx/tls/app.key;
        ssl_protocols       TLSv1.3;

        # --- mutual TLS: the caller must present a certificate signed by OUR root CA ---
        ssl_client_certificate /etc/nginx/tls/root.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        # --- and it must be the web server's certificate, not just any certificate ---
        if ($ssl_client_s_dn !~ "CN=web\.seclab\.test") {
            return 403;
        }

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }
    }
}
