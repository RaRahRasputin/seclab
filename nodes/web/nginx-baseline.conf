# web - nginx, BASELINE profile. Copied to /etc/nginx/nginx.conf
# The "before" web server: clear-text HTTP, version banner on, directory
# listing on, no security headers, no rate limit, clear-text to the back end.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens on;

    log_format seclab '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_user_agent" tls=- rt=$request_time';
    access_log /var/log/nginx/access.log seclab;

    upstream app_backend {
        server 10.10.20.10:8000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        root  /srv/portal;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /files/ {
            autoindex on;
        }

        location /api/ {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
