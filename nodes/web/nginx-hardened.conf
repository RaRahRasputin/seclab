# web - nginx, hardened profile. Copied to /etc/nginx/nginx.conf
# Public HTTPS reverse proxy in the DMZ. It serves static pages itself and
# forwards /api/ to the application server over mutually-authenticated TLS.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Do not advertise the nginx version in headers and error pages.
    server_tokens off;

    log_format seclab '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_user_agent" tls=$ssl_protocol rt=$request_time';
    access_log /var/log/nginx/access.log seclab;

    # Rate limit: each client address may make 50 API requests per second,
    # with a burst allowance of 100. Beyond that nginx answers 503 at once.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=50r/s;

    # Keep a pool of open TLS connections to the application server, so the
    # (expensive) mutual-TLS handshake is not repeated for every request.
    upstream app_backend {
        server 10.10.20.10:8443;
        keepalive 16;
    }

    # Port 80 exists only to send browsers to HTTPS.
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name portal.seclab.test;

        # Server certificate, issued by the lab's private CA.
        ssl_certificate     /etc/nginx/tls/web.crt;
        ssl_certificate_key /etc/nginx/tls/web.key;

        # Modern protocol versions and forward-secret AEAD cipher suites only.
        # For TLS 1.2 this string selects exactly six suites: ECDHE key exchange
        # with AES-GCM or ChaCha20-Poly1305 (check: openssl ciphers -v '<string>').
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:TLS:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        # Browser-side protections.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Content-Security-Policy   "default-src 'self'" always;
        add_header Referrer-Policy           "no-referrer" always;

        root  /srv/portal;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Files can be fetched by exact name, but the folder cannot be listed.
        location /files/ {
            autoindex off;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=100 nodelay;

            proxy_pass https://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # --- mutual TLS towards the application server ---
            # 1. present OUR client certificate
            proxy_ssl_certificate         /etc/nginx/tls/web-client.crt;
            proxy_ssl_certificate_key     /etc/nginx/tls/web-client.key;
            # 2. and verify THEIR server certificate against the lab root CA
            proxy_ssl_trusted_certificate /etc/nginx/tls/root.crt;
            proxy_ssl_verify              on;
            proxy_ssl_verify_depth        2;
            proxy_ssl_name                app.seclab.test;
            proxy_ssl_server_name         on;
            proxy_ssl_protocols           TLSv1.3;
            proxy_ssl_session_reuse       on;
        }
    }
}
