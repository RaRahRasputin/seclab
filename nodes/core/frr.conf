! core - FRRouting configuration (copied to /etc/frr/frr.conf at start-up)
frr version 8.4.4
frr defaults traditional
hostname core
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface eth1
 description transit-to-edge
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 Lab-0spf-Key-ChangeMe
!
router ospf
 ospf router-id 10.255.0.2
 log-adjacency-changes detail
 ! The VLAN interfaces are advertised but never speak OSPF: a workstation
 ! cannot inject routes by pretending to be a router.
 passive-interface default
 no passive-interface eth1
 network 10.10.0.0/30 area 0
 network 10.10.10.0/24 area 0
 network 10.10.20.0/24 area 0
 network 10.10.99.0/24 area 0
!
line vty
!
