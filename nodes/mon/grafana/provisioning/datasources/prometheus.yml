# Grafana data source, provisioned from this file at start-up (nothing to click).
# Grafana shares mon's network namespace, so Prometheus is simply "localhost".
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
