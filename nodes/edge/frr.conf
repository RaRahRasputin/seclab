! edge - FRRouting configuration (copied to /etc/frr/frr.conf at start-up)
frr version 8.4.4
frr defaults traditional
hostname edge
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
! Transit link to core: the only interface that forms an OSPF adjacency.
interface eth2
 description transit-to-core
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 Lab-0spf-Key-ChangeMe
!
router ospf
 ospf router-id 10.255.0.1
 log-adjacency-changes detail
 ! Passive by default: advertise a network without ever sending hellos on it.
 ! A rogue router on the WAN, DMZ or VPN side can therefore never become a neighbour.
 passive-interface default
 no passive-interface eth2
 network 10.10.0.0/30 area 0
 network 10.10.30.0/24 area 0
 network 10.10.200.0/24 area 0
 ! Tell core "send everything you do not know to me".
 default-information originate always metric 10
!
line vty
!
